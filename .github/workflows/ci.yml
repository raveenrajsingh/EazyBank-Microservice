name: Java CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - accounts
          - cards
          - loans
          - gatewayserver
          - configserver
          - eurekaserver

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn clean verify
