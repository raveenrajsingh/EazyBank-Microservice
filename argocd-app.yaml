apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eazybank
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raveenrajsingh/EazyBank-Microservice
    targetRevision: HEAD
    path: Helm
  destination:
    server: https://kubernetes.default.svc
    namespace: eazybank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
